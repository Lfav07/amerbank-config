server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/amerbank?currentSchema=transaction
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: transaction
    enabled: true
    locations: classpath:db/migration/transaction
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
transaction:
  account-service-base: "http://account/account/internal"
  endpoint-owned: "/owned"
  endpoint-deposit: "/deposit"
  endpoint-payment: "/payment"
  endpoint-refund: "/refund"
jwt:
  secret: ${JWT_SECRET}
  service-token-expiration-ms: 120000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health
