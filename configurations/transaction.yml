spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/amerbank?currentSchema=transaction
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    outOfOrder: true
    schemas: transaction
    enabled: true
    locations: classpath:db/migration/transaction

transaction:
  account-service-base: "http://account/accounts/internal"
  endpoint-owned: "/owned"
  endpoint-deposit: "/deposit"
  endpoint-payment: "/payment"
  endpoint-refund: "/refund"
jwt:
  secret: ${JWT_SECRET}
