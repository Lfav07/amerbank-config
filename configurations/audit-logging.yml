spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/amerbank?currentSchema=audit_log
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    schemas: audit_log
    enabled: true
    locations: classpath:db/migration/audit
  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: audit-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring:
          json:
            use:
              type:
                headers: false
            trusted:
              packages: com.amerbank.*
jwt:
  secret: ${JWT_SECRET}
  serviceTokenExpirationMs: 120000
  expirationMs: 3600000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health
