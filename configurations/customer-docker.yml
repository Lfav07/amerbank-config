server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/amerbank?currentSchema=customer
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: customer
    enabled: true
    locations: classpath:db/migration/customer
kafka:
  bootstrap-servers: kafka:9092
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  consumer:
    group-id: customer-service
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "*"
customer:
  trace-id-header: TRACE_ID_HEADER
  request-id-header: REQUEST_ID_HEADER
  auth-service-url: http://auth-server
  auth-register-path: /auth/internal/register
  auth-user-by-email-path: /auth/internal/users/by-email

jwt:
  secret: ${JWT_SECRET}
