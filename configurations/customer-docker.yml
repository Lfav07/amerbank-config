server:
  port: 8080
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/amerbank?currentSchema=customer
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: customer
    enabled: true
    locations: classpath:db/migration/customer
customer:
  trace-id-header: TRACE_ID_HEADER
  request-id-header: REQUEST_ID_HEADER
  auth-service-url: http://auth-server
  auth-register-path: /auth/internal/register
  auth-user-by-email-path: /auth/internal/users/by-email

eureka:
  client:
    service-url:
      defaultZone: http://discovery:8080/eureka/

jwt:
  secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health
