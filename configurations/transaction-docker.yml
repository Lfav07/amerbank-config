spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/amerbank?currentSchema=transaction
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: transaction
    enabled: true
    locations: classpath:db/migration/transaction

transaction:
  account-service-base: "http://account/account/internal"
  endpoint-owned: "/owned"
  endpoint-deposit: "/deposit"
  endpoint-payment: "/payment"
  endpoint-refund: "/refund"
jwt:
  secret: ${JWT_SECRET}
eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health
