apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
  labels:
    app: customer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
    spec:
      containers:
        - name: customer
          image: amerbank/customer:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: amerbank-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amerbank-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: amerbank-secrets
                  key: JWT_SECRET
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "customer"
            - name: EUREKA_INSTANCE_PREFERIPADDRESS
              value: "false"
          envFrom:
            - configMapRef:
                name: customer-config
---
apiVersion: v1
kind: Service
metadata:
  name: customer
spec:
  selector:
    app: customer
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
