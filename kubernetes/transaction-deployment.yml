apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction
  labels:
    app: transaction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction
  template:
    metadata:
      labels:
        app: transaction
    spec:
      containers:
        - name: transaction
          image: amerbank/transaction:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: amerbank-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amerbank-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: amerbank-secrets
                  key: JWT_SECRET
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "transaction"
            - name: EUREKA_INSTANCE_PREFERIPADDRESS
              value: "false"
          envFrom:
            - configMapRef:
                name: transaction-config
---
apiVersion: v1
kind: Service
metadata:
  name: transaction
spec:
  selector:
    app: transaction
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
